name: MySQL Database Migration

on:
  push:
    branches:
      - main
    paths:
      - 'sql/**'
      - '.github/workflows/db_migration.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysql-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Flyway Migrations
    runs-on: [self-hosted, macOS, ARM64]

    env:
      FLYWAY_URL: ${{ secrets.DB_URL }}
      FLYWAY_USER: ${{ secrets.DB_USERNAME }}
      FLYWAY_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLYWAY_LOCATIONS: filesystem:${{ github.workspace }}/sql

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Flyway installation
        run: flyway -v

      - name: Validate migrations
        run: flyway validate

      - name: Show migration status
        run: flyway info

      - name: Apply pending migrations
        run: flyway migrate

      - name: Verify migration status
        run: flyway info

